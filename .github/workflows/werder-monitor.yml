name: Werder Ticket Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: |
          pip install requests beautifulsoup4

      - name: Telegram Testnachricht

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \

            -d "chat_id=${TELEGRAM_CHAT_ID}" \

            --data-urlencode "text=🟢 Werder Ticket Monitor: Test erfolgreich! Dein Telegram-Alarm funktioniert."

      - name: Werder Ticket Monitor starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python werder_ticket_monitor.py

      - name: Status speichern
        run: |
          if [ ! -f state.json ]; then
            echo "Keine state.json vorhanden."
            exit 0
          fi

          git config user.name "Werder Ticket Monitor"
          git config user.email "actions@github.com"

          git add state.json
          git diff --cached --quiet || git commit -m "Update ticket monitor state"
          git push