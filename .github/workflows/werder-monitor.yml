name: Werder Ticket Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: |
          pip install requests beautifulsoup4

      - name: Telegram Chat-ID ermitteln
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          CHAT_ID=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
            | python -c "import sys,json; d=json.load(sys.stdin); u=d.get('result',[]); print(u[-1]['message']['chat']['id'] if u and 'message' in u[-1] else '')")

          if [ -z "$CHAT_ID" ]; then
            echo "Keine Telegram Chat-ID gefunden."
            echo "Bitte zuerst eine Nachricht an deinen Bot schicken."
            exit 1
          fi

          echo "chat_id=$CHAT_ID" >> "$GITHUB_OUTPUT"

      - name: Werder Ticket Monitor starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        run: |
          python werder_ticket_monitor.py

      - name: Status speichern
        run: |
          if git diff --quiet && [ ! -f state.json ]; then
            echo "Keine Änderungen."
            exit 0
          fi

          git config user.name "Werder Ticket Monitor"
          git config user.email "actions@github.com"

          git add state.json
          git diff --cached --quiet || git commit -m "Update ticket monitor state"
          git push